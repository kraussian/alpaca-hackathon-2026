[project]
name = "alpaca-hackathon-2026"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
# uv init --bare leaves no src layout, so put the repo root on sys.path
# rather than installing the package just to import it in tests.
pythonpath = ["."]
testpaths = ["tests"]
